services:
  neo4j:
    image: neo4j:5.26
    container_name: jarvis-x2-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/jarvis-local-password
    volumes:
      - jarvis_neo4j_data:/data

volumes:
  jarvis_neo4j_data:
